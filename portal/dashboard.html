<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<title>Your API keys — pyvar.com</title>
<meta name="robots" content="noindex"/>
<link rel="stylesheet" href="pyvar.css"/>
<style>
.dash-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:140px 0 72px}
.dash-card{max-width:520px;width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:6px;padding:32px;margin:0 auto}
.dash-title{font-family:var(--sans);font-size:22px;font-weight:600;color:var(--text);margin-bottom:10px}
.dash-body{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:20px}
.dash-body a{color:var(--green)}
.dash-token{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:14px 16px;font-family:var(--mono);font-size:12px;color:var(--green);word-break:break-all;margin-bottom:14px}
.dash-copy{font-family:var(--mono);font-size:10px;color:var(--dim);cursor:pointer;padding:5px 10px;border:1px solid var(--border);border-radius:2px;transition:all .15s;display:inline-block}
.dash-copy:hover{border-color:var(--green);color:var(--green)}
.dash-error{color:var(--red)}
.dash-card.wide{max-width:780px}
.key-table{width:100%;border-collapse:collapse;font-size:12px;margin:18px 0}
.key-table th{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--dim);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border2)}
.key-table td{padding:8px;border-bottom:1px solid var(--border);color:var(--text2)}
.key-table .mono{font-family:var(--mono)}
.key-table tr.key-revoked td,.key-table tr.key-expired td{color:var(--dim);text-decoration:line-through}
.dash-btn{font-family:var(--mono);font-size:10px;color:var(--text2);background:none;border:1px solid var(--border2);border-radius:2px;padding:4px 10px;cursor:pointer}
.dash-btn:hover{border-color:var(--red);color:var(--red)}
.key-hint{font-family:var(--mono);font-size:11px;margin-top:10px}
.key-form{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.key-form input{flex:1;min-width:180px;font-family:var(--mono);font-size:12px;padding:10px 12px;background:var(--bg);border:1px solid var(--border2);border-radius:2px;color:var(--text)}
</style>
</head>
<body>
<script src="pyvar.js"></script>
<script>document.write(buildNav('home'))</script>
<main>

<section class="dash-wrap">
  <div class="container">
    <div class="dash-card" id="dashCard">
      <div class="dash-title">Signing you in…</div>
      <div class="dash-body">One moment.</div>
    </div>
  </div>
</section>

</main>
<script>document.write(buildFooter())</script>
<script>renderDashboard();</script>
</body>
</html>
