<svg width="800" height="340" viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg"><rect width="800" height="340" fill="#ffffff"/><text x="400.0" y="36" font-family="Helvetica, Arial, sans-serif" font-size="20.5" font-weight="700" fill="#22303a" text-anchor="middle" >Getting a token: no password, no card</text><text x="110" y="58" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#22303a" text-anchor="middle" >you</text><text x="690" y="58" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#22303a" text-anchor="middle" >pyvar.com API</text><line x1="110" y1="74" x2="110" y2="244" stroke="#c7d1d6" stroke-width="1.5"/><line x1="690" y1="74" x2="690" y2="244" stroke="#c7d1d6" stroke-width="1.5"/><circle cx="110" cy="82" r="10" fill="#a84a2e"/><text x="110" y="86" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text><defs><marker id="ah34047" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4c6b7a"/></marker></defs>
<line x1="124" y1="98" x2="676" y2="98" stroke="#4c6b7a" stroke-width="1.8" marker-end="url(#ah34047)"/>
<text x="400.0" y="89" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4c6b7a" text-anchor="middle" font-style="italic" >POST /auth/register  {email}</text><circle cx="690" cy="134" r="10" fill="#a84a2e"/><text x="690" y="138" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text><defs><marker id="ah84213" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4c6b7a"/></marker></defs>
<line x1="676" y1="150" x2="124" y2="150" stroke="#4c6b7a" stroke-width="1.8" marker-end="url(#ah84213)"/>
<text x="400.0" y="141" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4c6b7a" text-anchor="middle" font-style="italic" >202 Accepted (always — never reveals if the email exists)</text><circle cx="110" cy="180" r="10" fill="#a84a2e"/><text x="110" y="184" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text><defs><marker id="ah91043" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4c6b7a"/></marker></defs>
<line x1="124" y1="196" x2="676" y2="196" stroke="#4c6b7a" stroke-width="1.8" marker-end="url(#ah91043)"/>
<text x="400.0" y="187" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4c6b7a" text-anchor="middle" font-style="italic" >click the emailed link → GET /auth/verify?token=...</text><circle cx="690" cy="224" r="10" fill="#a84a2e"/><text x="690" y="228" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text><defs><marker id="ah19635" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4c6b7a"/></marker></defs>
<line x1="676" y1="240" x2="124" y2="240" stroke="#4c6b7a" stroke-width="1.8" marker-end="url(#ah19635)"/>
<text x="400.0" y="231" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4c6b7a" text-anchor="middle" font-style="italic" >{"access_token": "eyJ...", "tier": "free"}</text><rect x="190.0" y="268" width="420" height="52" rx="8" fill="#f6e7e1" stroke="#a84a2e" stroke-width="1.8"/><text x="400.0" y="292" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#22303a" text-anchor="middle" >Authorization: Bearer eyJ...</text><text x="400.0" y="311" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="middle" font-style="italic" >sent on every call from here on</text></svg>