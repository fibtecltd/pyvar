<svg width="870" height="1098" viewBox="0 0 870 1098" xmlns="http://www.w3.org/2000/svg"><rect width="870" height="1098" fill="#ffffff"/><text x="435.0" y="36" font-family="Helvetica, Arial, sans-serif" font-size="20.5" font-weight="700" fill="#22303a" text-anchor="middle" >Who each plugin is actually for</text><rect x="30" y="74" width="810" height="40" rx="6" fill="#4c6b7a" stroke="#4c6b7a" stroke-width="1.5"/><text x="42" y="100" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start" >Skill</text><text x="282" y="100" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start" >Use case</text><rect x="30" y="114" width="810" height="104" rx="0" fill="#eef2f4" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="140" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#22303a" text-anchor="start" >pyvar-market-risk</text><text x="282" y="140" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >A trading or market risk desk computing daily VaR/ES,</text>
<text x="282" y="159" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >running Basel traffic-light backtesting, or building</text>
<text x="282" y="178" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >FRTB SA/IMA capital numbers from inside a Claude Code</text>
<text x="282" y="197" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >session.</text><rect x="30" y="218" width="810" height="85" rx="0" fill="#ffffff" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="244" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#22303a" text-anchor="start" >pyvar-credit-risk</text><text x="282" y="244" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >A credit risk team computing IRB/SA regulatory capital,</text>
<text x="282" y="263" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >pricing XVA adjustments, provisioning IFRS 9 ECL, or</text>
<text x="282" y="282" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >scoring counterparty PDs for a credit committee memo.</text><rect x="30" y="303" width="810" height="85" rx="0" fill="#eef2f4" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="329" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#22303a" text-anchor="start" >pyvar-liquidity-risk</text><text x="282" y="329" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >A treasury or liquidity risk team computing LCR/NSFR</text>
<text x="282" y="348" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >for a regulatory filing, building a cash-flow ladder,</text>
<text x="282" y="367" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >or running an internal ILAAP stress scenario.</text><rect x="30" y="388" width="810" height="85" rx="0" fill="#ffffff" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="414" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#22303a" text-anchor="start" >pyvar-operational-risk</text><text x="282" y="414" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >An op risk team running LDA/AMA/SMA capital models,</text>
<text x="282" y="433" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >scoring RCSA control effectiveness, or tracking KRI</text>
<text x="282" y="452" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >breaches ahead of a risk committee report.</text><rect x="30" y="473" width="810" height="104" rx="0" fill="#eef2f4" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="499" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#22303a" text-anchor="start" >pyvar-portfolio-analytics</text><text x="282" y="499" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >A portfolio manager or quant running mean-</text>
<text x="282" y="518" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >variance/Black-Litterman/risk-parity optimisation,</text>
<text x="282" y="537" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >Brinson performance attribution, or ESG-integrated</text>
<text x="282" y="556" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >portfolio construction.</text><rect x="30" y="577" width="810" height="104" rx="0" fill="#ffffff" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="603" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#22303a" text-anchor="start" >pyvar-regulatory</text><text x="282" y="603" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >A regulatory reporting or compliance team computing</text>
<text x="282" y="622" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >Basel III/IV capital ratios, checking MiFID II/EMIR</text>
<text x="282" y="641" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >transaction-reporting scope, or running a Solvency II</text>
<text x="282" y="660" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >SCR calculation.</text><rect x="30" y="681" width="810" height="104" rx="0" fill="#eef2f4" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="707" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#22303a" text-anchor="start" >pyvar-derivatives</text><text x="282" y="707" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >A derivatives desk pricing vanilla or exotic options</text>
<text x="282" y="726" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >(Black-Scholes through Heston/SABR/LSM), valuing</text>
<text x="282" y="745" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >bonds/IRS/CDS, or computing FX derivative</text>
<text x="282" y="764" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >sensitivities.</text><rect x="30" y="785" width="810" height="85" rx="0" fill="#ffffff" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="811" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#22303a" text-anchor="start" >pyvar-alm</text><text x="282" y="811" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >A treasury/ALM team computing duration gap, NII/EVE</text>
<text x="282" y="830" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >sensitivity under IRRBB's 6 standard shocks, or</text>
<text x="282" y="849" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >modelling non-maturity deposit behaviour.</text><rect x="30" y="870" width="810" height="104" rx="0" fill="#eef2f4" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="896" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#22303a" text-anchor="start" >pyvar-arch-* (5 skills)</text><text x="282" y="896" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >An engineer extending pyvar's own FastAPI layer,</text>
<text x="282" y="915" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >ingestion pipeline, Numba/Celery compute workers,</text>
<text x="282" y="934" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >storage layer, or observability stack — not a risk-</text>
<text x="282" y="953" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >domain user at all.</text><rect x="30" y="974" width="810" height="104" rx="0" fill="#ffffff" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="1000" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#22303a" text-anchor="start" >pyvar-mcp</text><text x="282" y="1000" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >Anyone who wants to call any of the 385 functions</text>
<text x="282" y="1019" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >directly from a Claude Code session or Claude.ai chat —</text>
<text x="282" y="1038" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >pricing an option, computing a VaR, checking a capital</text>
<text x="282" y="1057" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4c6b7a" text-anchor="start" >ratio — without writing HTTP client code by hand.</text></svg>