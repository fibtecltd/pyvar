<svg width="906" height="280" viewBox="0 0 906 280" xmlns="http://www.w3.org/2000/svg"><rect width="906" height="280" fill="#ffffff"/><text x="453.0" y="36" font-family="Helvetica, Arial, sans-serif" font-size="20.5" font-weight="700" fill="#22303a" text-anchor="middle" >One kernel call, three load-bearing rules</text><text x="453.0" y="59" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4c6b7a" text-anchor="middle" font-style="italic" >engine/montecarlo.py's _simulate_paths, annotated</text><rect x="30" y="108" width="195" height="106" rx="10" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><text x="127.5" y="134" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#22303a" text-anchor="middle" >pure Python</text><text x="127.5" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >np.random.randn()</text>
<text x="127.5" y="171.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >pre-draws random_shocks</text>
<text x="127.5" y="187.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >before the JIT region</text><defs><marker id="ah93183" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4c6b7a"/></marker></defs>
<line x1="225" y1="161.0" x2="247" y2="161.0" stroke="#4c6b7a" stroke-width="1.8" marker-end="url(#ah93183)"/><rect x="247" y="108" width="195" height="106" rx="10" fill="#f6e7e1" stroke="#a84a2e" stroke-width="2.2"/><text x="344.5" y="132" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#22303a" text-anchor="middle" >@njit(parallel=True,</text><text x="344.5" y="149" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#22303a" text-anchor="middle" >cache=True)</text><text x="344.5" y="170.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#a84a2e" text-anchor="middle" >prange across CPU cores,</text>
<text x="344.5" y="185.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#a84a2e" text-anchor="middle" >cache=True skips recompile</text>
<text x="344.5" y="201.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#a84a2e" text-anchor="middle" >on every fresh Spot worker</text><defs><marker id="ah29136" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4c6b7a"/></marker></defs>
<line x1="442" y1="161.0" x2="464" y2="161.0" stroke="#4c6b7a" stroke-width="1.8" marker-end="url(#ah29136)"/><rect x="464" y="108" width="195" height="106" rx="10" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><text x="561.5" y="134" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#22303a" text-anchor="middle" >returns np.ndarray</text><text x="561.5" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >never a list or dict —</text>
<text x="561.5" y="171.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >@njit only speaks arrays,</text>
<text x="561.5" y="187.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >scalars and primitives</text><defs><marker id="ah89033" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4c6b7a"/></marker></defs>
<line x1="659" y1="161.0" x2="681" y2="161.0" stroke="#4c6b7a" stroke-width="1.8" marker-end="url(#ah89033)"/><rect x="681" y="108" width="195" height="106" rx="10" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><text x="778.5" y="134" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#22303a" text-anchor="middle" >public wrapper</text><text x="778.5" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >converts to list/dict/float</text>
<text x="778.5" y="171.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >here — never inside</text>
<text x="778.5" y="187.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >the compiled kernel</text></svg>