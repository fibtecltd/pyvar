<svg width="950" height="402" viewBox="0 0 950 402" xmlns="http://www.w3.org/2000/svg"><rect width="950" height="402" fill="#ffffff"/><text x="475.0" y="36" font-family="Helvetica, Arial, sans-serif" font-size="20.5" font-weight="700" fill="#22303a" text-anchor="middle" >Exceptions you can actually branch on</text><rect x="30" y="76" width="890" height="42" rx="6" fill="#4c6b7a" stroke="#4c6b7a" stroke-width="1.5"/><text x="42" y="103" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start" >Exception</text><text x="262" y="103" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start" >Status</text><text x="412" y="103" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start" >What it carries</text><rect x="30" y="118" width="890" height="44" rx="0" fill="#eef2f4" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="144.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="normal" fill="#22303a" text-anchor="start" >PyvarAuthError</text><text x="262" y="144.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#22303a" text-anchor="start" >401</text><text x="412" y="144.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#22303a" text-anchor="start" >Token missing, invalid, or expired</text><rect x="30" y="162" width="890" height="44" rx="0" fill="#ffffff" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="188.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="normal" fill="#22303a" text-anchor="start" >PyvarValidationError</text><text x="262" y="188.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#22303a" text-anchor="start" >422</text><text x="412" y="188.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#22303a" text-anchor="start" >.detail — field-level validation errors</text><rect x="30" y="206" width="890" height="44" rx="0" fill="#eef2f4" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="232.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="normal" fill="#22303a" text-anchor="start" >PyvarRateLimitError</text><text x="262" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#22303a" text-anchor="start" >429</text><text x="412" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#22303a" text-anchor="start" >.retry_after (seconds), from the response header</text><rect x="30" y="250" width="890" height="44" rx="0" fill="#ffffff" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="276.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="normal" fill="#22303a" text-anchor="start" >PyvarComputeError</text><text x="262" y="276.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#22303a" text-anchor="start" >—</text><text x="412" y="276.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#22303a" text-anchor="start" >A VaR job reached status="failure" server-side; .task_id, .detail</text><rect x="30" y="294" width="890" height="44" rx="0" fill="#eef2f4" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="320.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="normal" fill="#22303a" text-anchor="start" >PyvarTimeoutError</text><text x="262" y="320.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#22303a" text-anchor="start" >—</text><text x="412" y="320.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#22303a" text-anchor="start" >.task_id — poll again, it may still complete</text><rect x="30" y="338" width="890" height="44" rx="0" fill="#ffffff" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="364.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="normal" fill="#22303a" text-anchor="start" >PyvarError</text><text x="262" y="364.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#22303a" text-anchor="start" >any other 4xx/5xx</text><text x="412" y="364.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#22303a" text-anchor="start" >Base class — catch this if you just want "did it fail"</text></svg>