<svg width="780" height="360" viewBox="0 0 780 360" xmlns="http://www.w3.org/2000/svg"><rect width="780" height="360" fill="#ffffff"/><text x="390.0" y="34" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#22303a" text-anchor="middle" >Exceptions you can actually branch on</text><rect x="30" y="76" width="720" height="36" rx="6" fill="#4c6b7a" stroke="#4c6b7a" stroke-width="1.5"/><text x="42" y="99" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start" >Exception</text><text x="232" y="99" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start" >Status</text><text x="342" y="99" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start" >What it carries</text><rect x="30" y="112" width="720" height="38" rx="0" fill="#eef2f4" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="135.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#22303a" text-anchor="start" >PyvarAuthError</text><text x="232" y="135.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#22303a" text-anchor="start" >401</text><text x="342" y="135.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#22303a" text-anchor="start" >Token missing, invalid, or expired</text><rect x="30" y="150" width="720" height="38" rx="0" fill="#ffffff" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="173.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#22303a" text-anchor="start" >PyvarValidationError</text><text x="232" y="173.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#22303a" text-anchor="start" >422</text><text x="342" y="173.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#22303a" text-anchor="start" >.detail — field-level validation errors</text><rect x="30" y="188" width="720" height="38" rx="0" fill="#eef2f4" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="211.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#22303a" text-anchor="start" >PyvarRateLimitError</text><text x="232" y="211.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#22303a" text-anchor="start" >429</text><text x="342" y="211.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#22303a" text-anchor="start" >.retry_after (seconds), from the response header</text><rect x="30" y="226" width="720" height="38" rx="0" fill="#ffffff" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="249.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#22303a" text-anchor="start" >PyvarComputeError</text><text x="232" y="249.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#22303a" text-anchor="start" >—</text><text x="342" y="249.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#22303a" text-anchor="start" >A VaR job reached status="failure" server-side; .task_id, .detail</text><rect x="30" y="264" width="720" height="38" rx="0" fill="#eef2f4" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="287.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#22303a" text-anchor="start" >PyvarTimeoutError</text><text x="232" y="287.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#22303a" text-anchor="start" >—</text><text x="342" y="287.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#22303a" text-anchor="start" >.task_id — poll again, it may still complete</text><rect x="30" y="302" width="720" height="38" rx="0" fill="#ffffff" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="325.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#22303a" text-anchor="start" >PyvarError</text><text x="232" y="325.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#22303a" text-anchor="start" >any other 4xx/5xx</text><text x="342" y="325.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#22303a" text-anchor="start" >Base class — catch this if you just want "did it fail"</text></svg>