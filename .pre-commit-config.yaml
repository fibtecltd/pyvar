# .pre-commit-config.yaml — pyvar.com
# Install: pip install pre-commit && pre-commit install
# Run all:  pre-commit run --all-files
# Update:   pre-commit autoupdate
#
# Hook order is intentional:
#   1. Formatting (fast, non-semantic)
#   2. Import hygiene
#   3. Linting (catches logic-level issues)
#   4. Security scanning
#   5. Type checking (slowest, most thorough)
#   6. Custom: Numba rule enforcement (engine/ only)
#   7. Custom: Regulatory threshold guard
#
# Note: pytest is NOT here — coverage gate belongs in CI (GitHub Actions).
# Pre-commit runs on every commit; a full pytest suite on every commit
# is too slow and creates bad commit habits.

default_stages: [pre-commit]
fail_fast: false  # run all hooks even if one fails — see full picture

repos:

  # ── 1. Formatting ──────────────────────────────────────────────────────────
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3.11
        args: [--line-length=100]

  # ── 2. Import sorting ──────────────────────────────────────────────────────
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]

  # ── 3. Linting ─────────────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # ── 4. Security scanning ───────────────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        # Skip test files — bandit false-positives on assert statements in tests
        exclude: ^tests/

  # ── 5. Type checking — strict on engine/, standard elsewhere ───────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        name: mypy (engine — strict)
        files: ^engine/
        args:
          - --strict
          - --python-version=3.11
          - --ignore-missing-imports
        additional_dependencies:
          - numpy>=1.26.0
          - numba>=0.59.0
      - id: mypy
        name: mypy (api + tasks — standard)
        files: ^(api|tasks|schemas|storage|observability)/
        args:
          - --python-version=3.11
          - --ignore-missing-imports
          - --disallow-untyped-defs
          - --warn-return-any
        additional_dependencies:
          - pydantic>=2.6.0
          - sqlalchemy[asyncio]>=2.0.0
          - fastapi>=0.110.0

  # ── 6. Numba rule enforcement (engine/ only) ───────────────────────────────
  # Catches the 6 most common @njit violations BEFORE they hit the test suite.
  # See CLAUDE.md section 3.1 for the full rule set.
  - repo: local
    hooks:
      - id: check-numba-rules
        name: Numba JIT rule checker
        language: python
        entry: python scripts/hooks/check_numba_rules.py
        files: ^engine/.*\.py$
        pass_filenames: true
        verbose: true

  # ── 7. Regulatory threshold guard ─────────────────────────────────────────
  # Prevents hardcoded regulatory constants from being replaced with
  # arbitrary literals. Catches: VaR confidence levels, backtesting
  # window, Basel breach zones, ES computation logic.
  - repo: local
    hooks:
      - id: check-regulatory
        name: Regulatory threshold guard
        language: python
        entry: python scripts/hooks/check_regulatory.py
        files: ^(engine|api|tasks|schemas)/.*\.py$
        pass_filenames: true
        verbose: true

  # ── 8. General file hygiene ────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: no-commit-to-branch
        args: [--branch=main]
        stages: [pre-commit]
