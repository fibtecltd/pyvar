# alembic.ini — Alembic configuration for pyvar
#
# IMPORTANT: sqlalchemy.url is overridden at runtime in env.py, via
# config.get_settings().postgres_dsn (same DSN the app itself uses).
# The value below is a fallback for local dev only.

[alembic]
script_location = migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
version_path_separator = os
truncate_slug_length = 40

# Fallback DSN for local dev — overridden by POSTGRES_DSN env var in env.py
sqlalchemy.url = postgresql://postgres:pyvar@localhost:5432/pyvar

[post_write_hooks]
# Automatically format migration scripts with Black after autogenerate
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = --line-length 100 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
