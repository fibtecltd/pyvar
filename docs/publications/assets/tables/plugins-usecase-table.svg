<svg width="840" height="848.5" viewBox="0 0 840 848.5" xmlns="http://www.w3.org/2000/svg"><rect width="840" height="848.5" fill="#ffffff"/><text x="420.0" y="34" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#22303a" text-anchor="middle" >Who each plugin is actually for</text><rect x="30" y="74" width="780" height="34" rx="6" fill="#4c6b7a" stroke="#4c6b7a" stroke-width="1.5"/><text x="42" y="96" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start" >Skill</text><text x="252" y="96" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start" >Use case</text><rect x="30" y="108" width="780" height="70.5" rx="0" fill="#eef2f4" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="132" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#22303a" text-anchor="start" >pyvar-market-risk</text><text x="252" y="132.0" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >A trading or market risk desk computing daily VaR/ES, running Basel</text>
<text x="252" y="147.5" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >traffic-light backtesting, or building FRTB SA/IMA capital numbers</text>
<text x="252" y="163.0" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >from inside a Claude Code session.</text><rect x="30" y="178.5" width="780" height="70.5" rx="0" fill="#ffffff" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="202.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#22303a" text-anchor="start" >pyvar-credit-risk</text><text x="252" y="202.5" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >A credit risk team computing IRB/SA regulatory capital, pricing XVA</text>
<text x="252" y="218.0" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >adjustments, provisioning IFRS 9 ECL, or scoring counterparty PDs</text>
<text x="252" y="233.5" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >for a credit committee memo.</text><rect x="30" y="249.0" width="780" height="70.5" rx="0" fill="#eef2f4" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="273.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#22303a" text-anchor="start" >pyvar-liquidity-risk</text><text x="252" y="273.0" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >A treasury or liquidity risk team computing LCR/NSFR for a</text>
<text x="252" y="288.5" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >regulatory filing, building a cash-flow ladder, or running an</text>
<text x="252" y="304.0" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >internal ILAAP stress scenario.</text><rect x="30" y="319.5" width="780" height="70.5" rx="0" fill="#ffffff" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="343.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#22303a" text-anchor="start" >pyvar-operational-risk</text><text x="252" y="343.5" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >An op risk team running LDA/AMA/SMA capital models, scoring RCSA</text>
<text x="252" y="359.0" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >control effectiveness, or tracking KRI breaches ahead of a risk</text>
<text x="252" y="374.5" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >committee report.</text><rect x="30" y="390.0" width="780" height="70.5" rx="0" fill="#eef2f4" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="414.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#22303a" text-anchor="start" >pyvar-portfolio-analytics</text><text x="252" y="414.0" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >A portfolio manager or quant running mean-variance/Black-</text>
<text x="252" y="429.5" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >Litterman/risk-parity optimisation, Brinson performance attribution,</text>
<text x="252" y="445.0" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >or ESG-integrated portfolio construction.</text><rect x="30" y="460.5" width="780" height="70.5" rx="0" fill="#ffffff" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="484.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#22303a" text-anchor="start" >pyvar-regulatory</text><text x="252" y="484.5" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >A regulatory reporting or compliance team computing Basel III/IV</text>
<text x="252" y="500.0" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >capital ratios, checking MiFID II/EMIR transaction-reporting scope,</text>
<text x="252" y="515.5" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >or running a Solvency II SCR calculation.</text><rect x="30" y="531.0" width="780" height="70.5" rx="0" fill="#eef2f4" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="555.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#22303a" text-anchor="start" >pyvar-derivatives</text><text x="252" y="555.0" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >A derivatives desk pricing vanilla or exotic options (Black-Scholes</text>
<text x="252" y="570.5" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >through Heston/SABR/LSM), valuing bonds/IRS/CDS, or computing FX</text>
<text x="252" y="586.0" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >derivative sensitivities.</text><rect x="30" y="601.5" width="780" height="70.5" rx="0" fill="#ffffff" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="625.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#22303a" text-anchor="start" >pyvar-alm</text><text x="252" y="625.5" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >A treasury/ALM team computing duration gap, NII/EVE sensitivity</text>
<text x="252" y="641.0" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >under IRRBB's 6 standard shocks, or modelling non-maturity deposit</text>
<text x="252" y="656.5" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >behaviour.</text><rect x="30" y="672.0" width="780" height="70.5" rx="0" fill="#eef2f4" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="696.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#22303a" text-anchor="start" >pyvar-arch-* (5 skills)</text><text x="252" y="696.0" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >An engineer extending pyvar's own FastAPI layer, ingestion pipeline,</text>
<text x="252" y="711.5" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >Numba/Celery compute workers, storage layer, or observability stack</text>
<text x="252" y="727.0" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >— not a risk-domain user at all.</text><rect x="30" y="742.5" width="780" height="86.0" rx="0" fill="#ffffff" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="766.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#22303a" text-anchor="start" >pyvar-mcp</text><text x="252" y="766.5" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >Anyone who wants to call any of the 385 functions directly from a</text>
<text x="252" y="782.0" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >Claude Code session or Claude.ai chat — pricing an option, computing</text>
<text x="252" y="797.5" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >a VaR, checking a capital ratio — without writing HTTP client code</text>
<text x="252" y="813.0" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >by hand.</text></svg>