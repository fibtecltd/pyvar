<svg width="1090" height="740" viewBox="0 0 1090 740" xmlns="http://www.w3.org/2000/svg"><rect width="1090" height="740" fill="#ffffff"/><text x="545.0" y="36" font-family="Helvetica, Arial, sans-serif" font-size="20.5" font-weight="700" fill="#22303a" text-anchor="middle" >The technology stack — and why each piece was chosen</text><rect x="30" y="76" width="1030" height="42" rx="6" fill="#4c6b7a" stroke="#4c6b7a" stroke-width="1.5"/><text x="42" y="103" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="start" >Layer</text><text x="192" y="103" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="start" >pyvar's choice</text><text x="422" y="103" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="start" >Alternative considered</text><text x="612" y="103" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="start" >Why chosen</text><rect x="30" y="118" width="1030" height="82" rx="0" fill="#eef2f4" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="144" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#22303a" text-anchor="start" >Monte Carlo kernel</text><text x="192" y="144" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#a84a2e" text-anchor="start" >Numba JIT</text>
<text x="192" y="162" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#a84a2e" text-anchor="start" >(@njit, parallel=True,</text>
<text x="192" y="180" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#a84a2e" text-anchor="start" >cache=True)</text><text x="422" y="144" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4c6b7a" text-anchor="start" >Cython / C extension</text><text x="612" y="144" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#22303a" text-anchor="start" >Stays pure Python — readable and auditable — with no separate</text>
<text x="612" y="162" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#22303a" text-anchor="start" >compile toolchain; cache=True skips recompilation on every</text>
<text x="612" y="180" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#22303a" text-anchor="start" >fresh Spot worker.</text><rect x="30" y="200" width="1030" height="64" rx="0" fill="#ffffff" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="226" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#22303a" text-anchor="start" >Async job dispatch</text><text x="192" y="226" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#a84a2e" text-anchor="start" >Celery + SQS FIFO</text><text x="422" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4c6b7a" text-anchor="start" >Redis Streams / raw</text>
<text x="422" y="244" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4c6b7a" text-anchor="start" >Lambda</text><text x="612" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#22303a" text-anchor="start" >task_acks_late=True survives a Spot interruption mid-job</text>
<text x="612" y="244" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#22303a" text-anchor="start" >without running a broker cluster ourselves.</text><rect x="30" y="264" width="1030" height="82" rx="0" fill="#eef2f4" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="290" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#22303a" text-anchor="start" >Compute capacity</text><text x="192" y="290" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#a84a2e" text-anchor="start" >EC2 Spot,</text>
<text x="192" y="308" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#a84a2e" text-anchor="start" >PRICE_CAPACITY_OPTIMIZED,</text>
<text x="192" y="326" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#a84a2e" text-anchor="start" >scale-to-zero</text><text x="422" y="290" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4c6b7a" text-anchor="start" >Fixed on-demand fleet</text><text x="612" y="290" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#22303a" text-anchor="start" >Sub-cent-per-scenario compute even at 1M scenarios/month (2</text>
<text x="612" y="308" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#22303a" text-anchor="start" >independent benchmarks); costs ~$0 when the queue is empty.</text><rect x="30" y="346" width="1030" height="64" rx="0" fill="#ffffff" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="372" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#22303a" text-anchor="start" >API hosting</text><text x="192" y="372" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#a84a2e" text-anchor="start" >ECS Fargate + Fargate Spot,</text>
<text x="192" y="390" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#a84a2e" text-anchor="start" >mixed</text><text x="422" y="372" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4c6b7a" text-anchor="start" >Pure Lambda per-request</text><text x="612" y="372" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#22303a" text-anchor="start" >A small always-on Fargate base guarantees availability; Spot</text>
<text x="612" y="390" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#22303a" text-anchor="start" >burst absorbs load without a cold-start tax on every request.</text><rect x="30" y="410" width="1030" height="82" rx="0" fill="#eef2f4" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="436" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#22303a" text-anchor="start" >Database</text><text x="192" y="436" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#a84a2e" text-anchor="start" >Aurora Serverless v2</text><text x="422" y="436" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4c6b7a" text-anchor="start" >Fixed-size RDS instance</text><text x="612" y="436" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#22303a" text-anchor="start" >Capacity (ACUs) scales with load instead of paying for a fixed</text>
<text x="612" y="454" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#22303a" text-anchor="start" >instance around the clock, while staying relational for the</text>
<text x="612" y="472" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#22303a" text-anchor="start" >job audit log.</text><rect x="30" y="492" width="1030" height="82" rx="0" fill="#ffffff" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="518" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#22303a" text-anchor="start" >Cache</text><text x="192" y="518" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#a84a2e" text-anchor="start" >ElastiCache Serverless</text><text x="422" y="518" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4c6b7a" text-anchor="start" >Self-managed Redis</text>
<text x="422" y="536" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4c6b7a" text-anchor="start" >cluster</text><text x="612" y="518" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#22303a" text-anchor="start" >No cluster to patch or fail over; flagged honestly in the cost</text>
<text x="612" y="536" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#22303a" text-anchor="start" >audit as the leading suspect behind the real-vs-estimated cost</text>
<text x="612" y="554" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#22303a" text-anchor="start" >gap.</text><rect x="30" y="574" width="1030" height="64" rx="0" fill="#eef2f4" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="600" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#22303a" text-anchor="start" >Edge / WAF</text><text x="192" y="600" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#a84a2e" text-anchor="start" >CloudFront + WAF, us-east-1</text><text x="422" y="600" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4c6b7a" text-anchor="start" >Direct ALB exposure</text><text x="612" y="600" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#22303a" text-anchor="start" >us-east-1 is a hard AWS requirement for a CloudFront-attached</text>
<text x="612" y="618" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#22303a" text-anchor="start" >WAFv2 WebACL, not a preference.</text><rect x="30" y="638" width="1030" height="82" rx="0" fill="#ffffff" stroke="#c7d1d6" stroke-width="1"/><text x="42" y="664" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#22303a" text-anchor="start" >CI/CD trigger</text><text x="192" y="664" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#a84a2e" text-anchor="start" >CodePipeline, git-path-</text>
<text x="192" y="682" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#a84a2e" text-anchor="start" >filtered</text><text x="422" y="664" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4c6b7a" text-anchor="start" >Run the pipeline on</text>
<text x="422" y="682" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4c6b7a" text-anchor="start" >every push</text><text x="612" y="664" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#22303a" text-anchor="start" >Skips a full Test/Build/Dev-deploy execution for docs-only</text>
<text x="612" y="682" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#22303a" text-anchor="start" >changes — a real, quantified cost avoidance already in</text>
<text x="612" y="700" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#22303a" text-anchor="start" >production.</text></svg>