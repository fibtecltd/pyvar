<svg width="760" height="430" viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg"><rect width="760" height="430" fill="#ffffff"/><text x="380.0" y="34" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#22303a" text-anchor="middle" >Three surfaces, one set of 385 functions</text><rect x="90" y="82" width="580" height="78" rx="10" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><text x="114" y="112" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#22303a" text-anchor="start" >pyvar-jupyter</text><text x="114" y="134" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4c6b7a" text-anchor="start" >%pyvar / %%pyvar IPython magics</text>
