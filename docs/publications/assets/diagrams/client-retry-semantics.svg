<svg width="760" height="360" viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg"><rect width="760" height="360" fill="#ffffff"/><text x="380.0" y="34" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#22303a" text-anchor="middle" >What retries automatically, and what never does</text><text x="380.0" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4c6b7a" text-anchor="middle" font-style="italic" >pyvar-client's retry policy, by call shape</text><rect x="60" y="78" width="460" height="80" rx="8" fill="#ffffff" stroke="#c7d1d6" stroke-width="1.3"/><text x="78" y="106" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#22303a" text-anchor="start" >Any domain method</text><text x="78" y="122" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4c6b7a" text-anchor="start" >market_risk.historical_simulation_var(...) — pure compute, no side effects</text><rect x="206" y="132" width="300" height="22" rx="11" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.4"/><text x="356.0" y="148" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="700" fill="#4c6b7a" text-anchor="middle" >auto-retries on timeout / connection error / 5xx</text><rect x="60" y="174" width="460" height="80" rx="8" fill="#ffffff" stroke="#c7d1d6" stroke-width="1.3"/><text x="78" y="202" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#22303a" text-anchor="start" >client.var.submit()</text><text x="78" y="218" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4c6b7a" text-anchor="start" >creates a real Monte Carlo job server-side — no idempotency key to de-duplicate on</text><rect x="206" y="228" width="300" height="22" rx="11" fill="#f6e7e1" stroke="#a84a2e" stroke-width="1.4"/><text x="356.0" y="244" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="700" fill="#a84a2e" text-anchor="middle" >never auto-retried — avoids double-submitting real work</text><rect x="60" y="270" width="460" height="80" rx="8" fill="#ffffff" stroke="#c7d1d6" stroke-width="1.3"/><text x="78" y="298" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#22303a" text-anchor="start" >client.var.poll()</text><text x="78" y="314" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4c6b7a" text-anchor="start" >checks job status — a plain read, no side effects</text><rect x="206" y="324" width="300" height="22" rx="11" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.4"/><text x="356.0" y="340" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="700" fill="#4c6b7a" text-anchor="middle" >auto-retries normally, same as any sync call</text></svg>