<svg width="900" height="459" viewBox="0 0 900 459" xmlns="http://www.w3.org/2000/svg"><rect width="900" height="459" fill="#ffffff"/><text x="450.0" y="36" font-family="Helvetica, Arial, sans-serif" font-size="20.5" font-weight="700" fill="#22303a" text-anchor="middle" >What retries automatically, and what never does</text><text x="450.0" y="59" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4c6b7a" text-anchor="middle" font-style="italic" >pyvar-client's retry policy, by call shape</text><rect x="40" y="82" width="820" height="101" rx="8" fill="#ffffff" stroke="#c7d1d6" stroke-width="1.3"/><text x="60" y="112" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#22303a" text-anchor="start" >Any domain method</text><text x="60" y="131" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#4c6b7a" text-anchor="start" >market_risk.historical_simulation_var(...) — pure compute, no side effects</text><rect x="60" y="149" width="368.00000000000006" height="26" rx="13" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.4"/><text x="244.00000000000003" y="167" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#4c6b7a" text-anchor="middle" >auto-retries on timeout / connection error / 5xx</text><rect x="40" y="201" width="820" height="101" rx="8" fill="#ffffff" stroke="#c7d1d6" stroke-width="1.3"/><text x="60" y="231" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#22303a" text-anchor="start" >client.var.submit()</text><text x="60" y="250" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#4c6b7a" text-anchor="start" >creates a real Monte Carlo job server-side — no idempotency key to de-duplicate on</text><rect x="60" y="268" width="417.00000000000006" height="26" rx="13" fill="#f6e7e1" stroke="#a84a2e" stroke-width="1.4"/><text x="268.5" y="286" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#a84a2e" text-anchor="middle" >never auto-retried — avoids double-submitting real work</text><rect x="40" y="320" width="820" height="101" rx="8" fill="#ffffff" stroke="#c7d1d6" stroke-width="1.3"/><text x="60" y="350" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#22303a" text-anchor="start" >client.var.poll()</text><text x="60" y="369" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#4c6b7a" text-anchor="start" >checks job status — a plain read, no side effects</text><rect x="60" y="387" width="340.00000000000006" height="26" rx="13" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.4"/><text x="230.00000000000003" y="405" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#4c6b7a" text-anchor="middle" >auto-retries normally, same as any sync call</text></svg>