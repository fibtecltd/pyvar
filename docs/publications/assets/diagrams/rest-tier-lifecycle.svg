<svg width="800" height="340" viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg"><rect width="800" height="340" fill="#ffffff"/><text x="400.0" y="34" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#22303a" text-anchor="middle" >Tier lifecycle</text><text x="400.0" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4c6b7a" text-anchor="middle" font-style="italic" >not every downgrade restores the same way</text><circle cx="190" cy="150" r="68" fill="#eef2f4" stroke="#4c6b7a" stroke-width="2"/><text x="190" y="146" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#22303a" text-anchor="middle" >Free</text><text x="190" y="168" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >10k sims / 10 req/day</text><circle cx="610" cy="150" r="68" fill="#f6e7e1" stroke="#a84a2e" stroke-width="2.4"/><text x="610" y="146" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#22303a" text-anchor="middle" >Pro</text><text x="610" y="168" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >100k sims / 500 req/day</text><defs><marker id="ah85270" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4c6b7a"/></marker></defs>
