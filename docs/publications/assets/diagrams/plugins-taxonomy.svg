<svg width="820" height="450" viewBox="0 0 820 450" xmlns="http://www.w3.org/2000/svg"><rect width="820" height="450" fill="#ffffff"/><text x="410.0" y="36" font-family="Helvetica, Arial, sans-serif" font-size="20.5" font-weight="700" fill="#22303a" text-anchor="middle" >Two different jobs, 14 plugins</text><rect x="40" y="70" width="740" height="346" rx="14" fill="#ffffff" stroke="#c7d1d6" stroke-width="1.5"/><text x="60" y="100" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#4c6b7a" text-anchor="start" >14 plugins</text><rect x="60.0" y="122" width="220.0" height="268" rx="10" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><text x="170.0" y="150" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#22303a" text-anchor="middle" >Domain skills</text><text x="170.0" y="169" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#4c6b7a" text-anchor="middle" >8 — instructional only</text><text x="170.0" y="192" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >• market-risk, credit-risk,</text><text x="170.0" y="210" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >• liquidity-risk, operational-risk,</text><text x="170.0" y="228" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >• portfolio-analytics, regulatory,</text><text x="170.0" y="246" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >• derivatives, alm</text><rect x="300.0" y="122" width="220.0" height="268" rx="10" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><text x="410.0" y="150" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#22303a" text-anchor="middle" >Architecture skills</text><text x="410.0" y="169" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#4c6b7a" text-anchor="middle" >5 — for pyvar's own code</text><text x="410.0" y="192" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >• api-gateway, compute,</text><text x="410.0" y="210" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >• data-ingestion, storage,</text><text x="410.0" y="228" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >• observability</text><rect x="540.0" y="122" width="220.0" height="268" rx="10" fill="#f6e7e1" stroke="#a84a2e" stroke-width="2"/><text x="650.0" y="150" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#22303a" text-anchor="middle" >pyvar-mcp</text><text x="650.0" y="169" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#a84a2e" text-anchor="middle" >1 — executes live requests</text><text x="650.0" y="192" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >• live MCP server → REST API,</text><text x="650.0" y="210" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >• 385 tools, one per function,</text><text x="650.0" y="228" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >• always in sync with what's deployed</text><text x="410.0" y="446" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4c6b7a" text-anchor="middle" font-style="italic" >13 skills: pure knowledge, no network access, no data collection — pyvar-mcp is the one exception</text></svg>