<svg width="800" height="430" viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg"><rect width="800" height="430" fill="#ffffff"/><text x="400.0" y="34" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#22303a" text-anchor="middle" >Two different jobs, 14 plugins</text><rect x="40" y="68" width="720" height="330" rx="14" fill="#ffffff" stroke="#c7d1d6" stroke-width="1.5"/><text x="60" y="98" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#4c6b7a" text-anchor="start" >14 plugins</text><rect x="60.0" y="118" width="220.0" height="256" rx="10" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><text x="170.0" y="144" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#22303a" text-anchor="middle" >Domain skills</text><text x="170.0" y="162" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#4c6b7a" text-anchor="middle" >8 — instructional only</text><text x="76.0" y="184" font-family="Helvetica, Arial, sans-serif" font-size="10.7" font-weight="normal" fill="#4c6b7a" text-anchor="start" >• market-risk, credit-risk,</text><text x="76.0" y="200" font-family="Helvetica, Arial, sans-serif" font-size="10.7" font-weight="normal" fill="#4c6b7a" text-anchor="start" >• liquidity-risk, operational-risk,</text><text x="76.0" y="216" font-family="Helvetica, Arial, sans-serif" font-size="10.7" font-weight="normal" fill="#4c6b7a" text-anchor="start" >• portfolio-analytics, regulatory,</text><text x="76.0" y="232" font-family="Helvetica, Arial, sans-serif" font-size="10.7" font-weight="normal" fill="#4c6b7a" text-anchor="start" >• derivatives, alm</text><rect x="300.0" y="118" width="220.0" height="256" rx="10" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><text x="410.0" y="144" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#22303a" text-anchor="middle" >Architecture skills</text><text x="410.0" y="162" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#4c6b7a" text-anchor="middle" >5 — for pyvar's own code</text><text x="316.0" y="184" font-family="Helvetica, Arial, sans-serif" font-size="10.7" font-weight="normal" fill="#4c6b7a" text-anchor="start" >• api-gateway, compute,</text><text x="316.0" y="200" font-family="Helvetica, Arial, sans-serif" font-size="10.7" font-weight="normal" fill="#4c6b7a" text-anchor="start" >• data-ingestion, storage,</text><text x="316.0" y="216" font-family="Helvetica, Arial, sans-serif" font-size="10.7" font-weight="normal" fill="#4c6b7a" text-anchor="start" >• observability</text><rect x="540.0" y="118" width="220.0" height="256" rx="10" fill="#f6e7e1" stroke="#a84a2e" stroke-width="2"/><text x="650.0" y="144" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#22303a" text-anchor="middle" >pyvar-mcp</text><text x="650.0" y="162" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#a84a2e" text-anchor="middle" >1 — executes live requests</text><text x="556.0" y="184" font-family="Helvetica, Arial, sans-serif" font-size="10.7" font-weight="normal" fill="#4c6b7a" text-anchor="start" >• live MCP server → REST API,</text><text x="556.0" y="200" font-family="Helvetica, Arial, sans-serif" font-size="10.7" font-weight="normal" fill="#4c6b7a" text-anchor="start" >• 385 tools, one per function,</text><text x="556.0" y="216" font-family="Helvetica, Arial, sans-serif" font-size="10.7" font-weight="normal" fill="#4c6b7a" text-anchor="start" >• always in sync with what's deployed</text><text x="400.0" y="426" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#4c6b7a" text-anchor="middle" font-style="italic" >13 skills: pure knowledge, no network access, no data collection — pyvar-mcp is the one exception</text></svg>