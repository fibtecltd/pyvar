<svg width="820" height="460" viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg"><rect width="820" height="460" fill="#ffffff"/><text x="410.0" y="34" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#22303a" text-anchor="middle" >Three layers, three different scaling strategies</text><text x="155.0" y="72" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#22303a" text-anchor="middle" >Celery workers</text><text x="155.0" y="88" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#4c6b7a" text-anchor="middle" font-style="italic" >EC2 Spot, PRICE_CAPACITY_OPTIMIZED</text><line x1="40" y1="316" x2="270" y2="316" stroke="#c7d1d6" stroke-width="1.3"/><text x="415.0" y="72" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#22303a" text-anchor="middle" >API (Fargate)</text><text x="415.0" y="88" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#4c6b7a" text-anchor="middle" font-style="italic" >on-demand base + Spot burst</text><line x1="300" y1="316" x2="530" y2="316" stroke="#c7d1d6" stroke-width="1.3"/><text x="675.0" y="72" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#22303a" text-anchor="middle" >Aurora Serverless v2</text><text x="675.0" y="88" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#4c6b7a" text-anchor="middle" font-style="italic" >0.5-ACU floor, fine-grained steps</text><line x1="560" y1="316" x2="790" y2="316" stroke="#c7d1d6" stroke-width="1.3"/><path d="M 50 316 L 50 316 L 80 316 L 80 126 L 160 126 L 160 316 L 260 316" fill="none" stroke="#a84a2e" stroke-width="2.4"/><rect x="80" y="126" width="80" height="190" rx="0" fill="#f6e7e1" stroke="none" stroke-width="1.5"/><path d="M 50 316 L 50 316 L 80 316 L 80 126 L 160 126 L 160 316 L 260 316" fill="none" stroke="#a84a2e" stroke-width="2.4"/><text x="155.0" y="338" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >min_capacity = 0 — nothing running,</text><text x="155.0" y="352" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >nothing billed, when the queue is empty</text><rect x="310" y="290" width="210" height="26" rx="3" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><path d="M 310 290 L 360 290 L 360 116 L 450 116 L 450 290 L 520 290" fill="none" stroke="#a84a2e" stroke-width="2.4"/><text x="415.0" y="307.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >on-demand floor</text><text x="415.0" y="338" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >always-on base for availability,</text><text x="415.0" y="352" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >Spot handles the burst above it</text><path d="M 570 294 L 610 294 L 610 276 L 670 276 L 670 258 L 730 258 L 730 276 L 780 276" fill="none" stroke="#a84a2e" stroke-width="2.4"/><line x1="570" y1="316" x2="780" y2="316" stroke="#4c6b7a" stroke-width="1.4" stroke-dasharray="3,3"/><text x="675.0" y="338" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >~$45/month at rest (min_acu=0.5),</text><text x="675.0" y="352" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >steps up under load, no cold start</text><text x="410.0" y="438" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#4c6b7a" text-anchor="middle" font-style="italic" >idle infrastructure costs as close to nothing as availability allows — and where it can't, the floor is an explicit, named number</text></svg>