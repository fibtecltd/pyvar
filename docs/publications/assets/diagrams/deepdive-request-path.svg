<svg width="820" height="660" viewBox="0 0 820 660" xmlns="http://www.w3.org/2000/svg"><rect width="820" height="660" fill="#ffffff"/><text x="410.0" y="34" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#22303a" text-anchor="middle" >Only one endpoint is actually async</text><rect x="70" y="70" width="190" height="56" rx="10" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><text x="165.0" y="104" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#22303a" text-anchor="middle" >MCP server</text><rect x="300" y="70" width="190" height="56" rx="10" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><text x="395.0" y="104" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#22303a" text-anchor="middle" >pyvar-client</text><rect x="530" y="70" width="190" height="56" rx="10" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><text x="625.0" y="104" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#22303a" text-anchor="middle" >pyvar-jupyter</text><line x1="165.0" y1="126" x2="410.0" y2="196" stroke="#4c6b7a" stroke-width="1.6"/><line x1="395.0" y1="126" x2="410.0" y2="196" stroke="#4c6b7a" stroke-width="1.6"/><line x1="625.0" y1="126" x2="410.0" y2="196" stroke="#4c6b7a" stroke-width="1.6"/><rect x="180.0" y="196" width="460" height="60" rx="10" fill="#f6e7e1" stroke="#a84a2e" stroke-width="2.2"/><text x="410.0" y="222" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#22303a" text-anchor="middle" >pyvar.com REST API</text><text x="410.0" y="242" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#a84a2e" text-anchor="middle" >one SDK underneath — no duplicated auth or retry logic</text><defs><marker id="rpL" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto"><path d="M0,0 L8,0 L4,7 z" fill="#4c6b7a"/></marker><marker id="rpR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto"><path d="M0,0 L8,0 L4,7 z" fill="#4c6b7a"/></marker></defs><path d="M 350.0 256 Q 260.0 282 260.0 312" fill="none" stroke="#4c6b7a" stroke-width="1.8" marker-end="url(#rpL)"/><path d="M 470.0 256 Q 560.0 282 560.0 312" fill="none" stroke="#4c6b7a" stroke-width="1.8" marker-end="url(#rpR)"/><rect x="150.0" y="312" width="220" height="56" rx="10" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><text x="260.0" y="336" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#22303a" text-anchor="middle" >384 sync functions</text><text x="260.0" y="354" font-family="Helvetica, Arial, sans-serif" font-size="10.3" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >direct JSON response</text><rect x="450.0" y="312" width="220" height="56" rx="10" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><text x="560.0" y="336" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#22303a" text-anchor="middle" >var.compute (async)</text><text x="560.0" y="354" font-family="Helvetica, Arial, sans-serif" font-size="10.3" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >returns a task_id</text><defs><marker id="ah40931" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto"><path d="M0,0 L8,0 L4,7 z" fill="#4c6b7a"/></marker></defs>
<line x1="560.0" y1="368" x2="560.0" y2="418" stroke="#4c6b7a" stroke-width="1.8" marker-end="url(#ah40931)"/><rect x="440.0" y="418" width="240" height="66" rx="10" fill="#f6e7e1" stroke="#a84a2e" stroke-width="1.8"/><text x="560.0" y="442" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#22303a" text-anchor="middle" >SQS FIFO queue</text><text x="454.0" y="460" font-family="Helvetica, Arial, sans-serif" font-size="9.6" font-weight="normal" fill="#a84a2e" text-anchor="middle" >task_acks_late=True — no lost jobs</text>
<text x="454.0" y="474" font-family="Helvetica, Arial, sans-serif" font-size="9.6" font-weight="normal" fill="#a84a2e" text-anchor="middle" >on a Spot interruption</text><defs><marker id="ah22645" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto"><path d="M0,0 L8,0 L4,7 z" fill="#4c6b7a"/></marker></defs>
<line x1="560.0" y1="484" x2="560.0" y2="534" stroke="#4c6b7a" stroke-width="1.8" marker-end="url(#ah22645)"/><rect x="440.0" y="534" width="240" height="56" rx="10" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><text x="560.0" y="558" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#22303a" text-anchor="middle" >Celery worker, EC2 Spot</text><text x="560.0" y="576" font-family="Helvetica, Arial, sans-serif" font-size="9.8" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >polled via /var/result/&lt;id&gt;</text></svg>