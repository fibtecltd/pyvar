<svg width="860" height="680" viewBox="0 0 860 680" xmlns="http://www.w3.org/2000/svg"><rect width="860" height="680" fill="#ffffff"/><text x="430.0" y="36" font-family="Helvetica, Arial, sans-serif" font-size="20.5" font-weight="700" fill="#22303a" text-anchor="middle" >Only one endpoint is actually async</text><rect x="70" y="74" width="200" height="60" rx="10" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><text x="170.0" y="111" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#22303a" text-anchor="middle" >MCP server</text><rect x="310" y="74" width="200" height="60" rx="10" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><text x="410.0" y="111" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#22303a" text-anchor="middle" >pyvar-client</text><rect x="550" y="74" width="200" height="60" rx="10" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><text x="650.0" y="111" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#22303a" text-anchor="middle" >pyvar-jupyter</text><line x1="170.0" y1="134" x2="430.0" y2="204" stroke="#4c6b7a" stroke-width="1.6"/><line x1="410.0" y1="134" x2="430.0" y2="204" stroke="#4c6b7a" stroke-width="1.6"/><line x1="650.0" y1="134" x2="430.0" y2="204" stroke="#4c6b7a" stroke-width="1.6"/><rect x="190.0" y="204" width="480" height="66" rx="10" fill="#f6e7e1" stroke="#a84a2e" stroke-width="2.2"/><text x="430.0" y="232" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#22303a" text-anchor="middle" >pyvar.com REST API</text><text x="430.0" y="253" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#a84a2e" text-anchor="middle" >one SDK underneath — no duplicated auth or retry logic</text><defs><marker id="rpL" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4c6b7a"/></marker><marker id="rpR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4c6b7a"/></marker></defs><path d="M 370.0 270 Q 260.0 296 260.0 326" fill="none" stroke="#4c6b7a" stroke-width="1.8" marker-end="url(#rpL)"/><path d="M 490.0 270 Q 600.0 296 600.0 326" fill="none" stroke="#4c6b7a" stroke-width="1.8" marker-end="url(#rpR)"/><rect x="130.0" y="326" width="260" height="62" rx="10" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><text x="260.0" y="353" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#22303a" text-anchor="middle" >384 sync functions</text><text x="260.0" y="373" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >direct JSON response</text><rect x="470.0" y="326" width="260" height="62" rx="10" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><text x="600.0" y="353" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#22303a" text-anchor="middle" >var.compute (async)</text><text x="600.0" y="373" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >returns a task_id</text><defs><marker id="ah73813" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4c6b7a"/></marker></defs>
<line x1="600.0" y1="388" x2="600.0" y2="438" stroke="#4c6b7a" stroke-width="1.8" marker-end="url(#ah73813)"/><rect x="450.0" y="438" width="300" height="74" rx="10" fill="#f6e7e1" stroke="#a84a2e" stroke-width="1.8"/><text x="600.0" y="465" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#22303a" text-anchor="middle" >SQS FIFO queue</text><text x="600.0" y="486" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="normal" fill="#a84a2e" text-anchor="middle" >task_acks_late=True — no lost jobs</text>
<text x="600.0" y="502" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="normal" fill="#a84a2e" text-anchor="middle" >on a Spot interruption</text><defs><marker id="ah81705" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4c6b7a"/></marker></defs>
<line x1="600.0" y1="512" x2="600.0" y2="562" stroke="#4c6b7a" stroke-width="1.8" marker-end="url(#ah81705)"/><rect x="450.0" y="562" width="300" height="62" rx="10" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><text x="600.0" y="589" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#22303a" text-anchor="middle" >Celery worker, EC2 Spot</text><text x="600.0" y="609" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >polled via /var/result/&lt;id&gt;</text></svg>