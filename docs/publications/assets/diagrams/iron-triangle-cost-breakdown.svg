<svg width="1060" height="420" viewBox="0 0 1060 420" xmlns="http://www.w3.org/2000/svg"><rect width="1060" height="420" fill="#ffffff"/><text x="530.0" y="36" font-family="Helvetica, Arial, sans-serif" font-size="20.5" font-weight="700" fill="#22303a" text-anchor="middle" >Where the money actually goes</text><text x="530.0" y="59" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4c6b7a" text-anchor="middle" font-style="italic" >fixed infrastructure dominates — simulation volume barely moves the number</text><rect x="320" y="100" width="560" height="56" rx="6" fill="#f6e7e1" stroke="#a84a2e" stroke-width="2.2"/><text x="300" y="124" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#22303a" text-anchor="end" >Fixed infrastructure</text><text x="300" y="144" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#22303a" text-anchor="end" >baseline (real invoice)</text><text x="900" y="134" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#a84a2e" text-anchor="start" >$900–$1,000/month</text><rect x="320" y="256" width="5" height="56" rx="2" fill="#4c6b7a" stroke="#4c6b7a" stroke-width="1.5"/><text x="300" y="280" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#22303a" text-anchor="end" >Extra compute for</text><text x="300" y="300" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#22303a" text-anchor="end" >10k → 1M scenarios/mo</text><text x="340" y="290" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#4c6b7a" text-anchor="start" >well under $0.12/month</text><text x="320" y="336" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4c6b7a" text-anchor="start" font-style="italic" >(bar not to scale — true width would be under 1/1000th of a pixel)</text><text x="530.0" y="396" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4c6b7a" text-anchor="middle" font-style="italic" >Same architecture at 10,000, 100,000, or 1,000,000 scenarios/month: cost is indistinguishable</text></svg>