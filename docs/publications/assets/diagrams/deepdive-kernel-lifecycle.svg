<svg width="820" height="260" viewBox="0 0 820 260" xmlns="http://www.w3.org/2000/svg"><rect width="820" height="260" fill="#ffffff"/><text x="410.0" y="34" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#22303a" text-anchor="middle" >One kernel call, three load-bearing rules</text><text x="410.0" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4c6b7a" text-anchor="middle" font-style="italic" >engine/montecarlo.py's _simulate_paths, annotated</text><rect x="30" y="100" width="175" height="96" rx="10" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><text x="117.5" y="124" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#22303a" text-anchor="middle" >pure Python</text><text x="44" y="144" font-family="Helvetica, Arial, sans-serif" font-size="10.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >np.random.randn()</text>
<text x="44" y="158" font-family="Helvetica, Arial, sans-serif" font-size="10.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >pre-draws random_shocks</text>
<text x="44" y="172" font-family="Helvetica, Arial, sans-serif" font-size="10.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >before the JIT region</text><defs><marker id="ah28950" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4c6b7a"/></marker></defs>
<line x1="205" y1="148.0" x2="247" y2="148.0" stroke="#4c6b7a" stroke-width="1.8" marker-end="url(#ah28950)"/><rect x="247" y="100" width="175" height="96" rx="10" fill="#f6e7e1" stroke="#a84a2e" stroke-width="2.2"/><text x="334.5" y="122" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#22303a" text-anchor="middle" >@njit(parallel=True,</text><text x="334.5" y="138" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#22303a" text-anchor="middle" >cache=True)</text><text x="261" y="158" font-family="Helvetica, Arial, sans-serif" font-size="10.3" font-weight="normal" fill="#a84a2e" text-anchor="start" >prange across CPU cores,</text>
<text x="261" y="172" font-family="Helvetica, Arial, sans-serif" font-size="10.3" font-weight="normal" fill="#a84a2e" text-anchor="start" >cache=True skips recompile</text>
<text x="261" y="186" font-family="Helvetica, Arial, sans-serif" font-size="10.3" font-weight="normal" fill="#a84a2e" text-anchor="start" >on every fresh Spot worker</text><defs><marker id="ah18825" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4c6b7a"/></marker></defs>
<line x1="422" y1="148.0" x2="464" y2="148.0" stroke="#4c6b7a" stroke-width="1.8" marker-end="url(#ah18825)"/><rect x="464" y="100" width="175" height="96" rx="10" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><text x="551.5" y="124" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#22303a" text-anchor="middle" >returns np.ndarray</text><text x="478" y="144" font-family="Helvetica, Arial, sans-serif" font-size="10.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >never a list or dict —</text>
<text x="478" y="158" font-family="Helvetica, Arial, sans-serif" font-size="10.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >@njit only speaks arrays,</text>
<text x="478" y="172" font-family="Helvetica, Arial, sans-serif" font-size="10.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >scalars and primitives</text><defs><marker id="ah86691" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4c6b7a"/></marker></defs>
<line x1="639" y1="148.0" x2="681" y2="148.0" stroke="#4c6b7a" stroke-width="1.8" marker-end="url(#ah86691)"/><rect x="681" y="100" width="175" height="96" rx="10" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><text x="768.5" y="124" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#22303a" text-anchor="middle" >public wrapper</text><text x="695" y="144" font-family="Helvetica, Arial, sans-serif" font-size="10.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >converts to list/dict/float</text>
<text x="695" y="158" font-family="Helvetica, Arial, sans-serif" font-size="10.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >here — never inside</text>
<text x="695" y="172" font-family="Helvetica, Arial, sans-serif" font-size="10.3" font-weight="normal" fill="#4c6b7a" text-anchor="start" >the compiled kernel</text></svg>