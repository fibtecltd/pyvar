<svg width="800" height="460" viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg"><rect width="800" height="460" fill="#ffffff"/><text x="400.0" y="36" font-family="Helvetica, Arial, sans-serif" font-size="20.5" font-weight="700" fill="#22303a" text-anchor="middle" >One call, two views</text><text x="400.0" y="59" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4c6b7a" text-anchor="middle" font-style="italic" >both magic forms resolve to the same pyvar-client call underneath</text><rect x="60" y="84" width="320" height="72" rx="10" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><text x="220.0" y="112" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#22303a" text-anchor="middle" >%pyvar market_risk.func a=1 b=2</text><text x="220.0" y="134" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >line magic — params parsed with ast.literal_eval</text><rect x="420" y="84" width="320" height="72" rx="10" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><text x="580.0" y="112" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#22303a" text-anchor="middle" >%%pyvar market_risk.func</text><text x="580.0" y="134" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >cell magic — body parsed as JSON</text><line x1="220.0" y1="162" x2="394.0" y2="218" stroke="#4c6b7a" stroke-width="1.8"/><line x1="580.0" y1="162" x2="406.0" y2="218" stroke="#4c6b7a" stroke-width="1.8"/><rect x="170.0" y="224" width="460" height="70" rx="10" fill="#f6e7e1" stroke="#a84a2e" stroke-width="2"/><text x="400.0" y="252" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#22303a" text-anchor="middle" >dispatch to the same pyvar-client call</text><text x="400.0" y="274" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >no parameters → prints docstring + signature instead</text><defs><marker id="mdL" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4c6b7a"/></marker><marker id="mdR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4c6b7a"/></marker></defs><path d="M 350.0 294 Q 260.0 330 260.0 354" fill="none" stroke="#4c6b7a" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#mdL)"/><path d="M 450.0 294 Q 540.0 330 540.0 354" fill="none" stroke="#4c6b7a" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#mdR)"/><rect x="150.0" y="360" width="220" height="70" rx="10" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><text x="260.0" y="388" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#22303a" text-anchor="middle" >rendered HTML table</text><text x="260.0" y="410" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >shown in the cell output</text><rect x="430.0" y="360" width="220" height="70" rx="10" fill="#eef2f4" stroke="#4c6b7a" stroke-width="1.5"/><text x="540.0" y="388" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#22303a" text-anchor="middle" >the plain result dict</text><text x="540.0" y="410" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#4c6b7a" text-anchor="middle" >also bound to Out[]</text></svg>