[pytest]
asyncio_mode = auto
# Pin the async-fixture event-loop scope explicitly. pytest-asyncio warns when
# this is unset and will change the default in a future release; "function"
# preserves today's behaviour (a fresh loop per test) and silences that
# forward-looking deprecation.
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
log_cli = true
log_cli_level = WARNING
