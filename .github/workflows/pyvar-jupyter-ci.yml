name: pyvar-jupyter CI

# Scoped via paths: to pyvar-jupyter/** and pyvar-client/** -- this package
# is built on top of pyvar-client (see pyvar_jupyter/_magics.py's own module
# docstring: no second HTTP/auth layer, just the magic/display layer), so a
# breaking change there is exactly the kind of thing that should also run
# this suite, same reasoning pyvar-client-ci.yml itself applies to api/**
# and schemas/** for its own codegen-drift job.

on:
  pull_request:
    branches: [master, develop]
    paths:
      - "pyvar-jupyter/**"
      - "pyvar-client/**"
      - ".github/workflows/pyvar-jupyter-ci.yml"
  push:
    branches-ignore: [master]
    paths:
      - "pyvar-jupyter/**"
      - "pyvar-client/**"
      - ".github/workflows/pyvar-jupyter-ci.yml"

# Declaring `permissions:` at all zeroes every unlisted scope on the default
# GITHUB_TOKEN. The job only checks out and tests -- contents: read is all
# it needs.
permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # pyvar-jupyter depends on pyvar-client -- install the local checkout,
      # not whatever's latest on PyPI, so this suite always tests against
      # this PR's own pyvar-client changes too.
      - name: Install pyvar-client, then pyvar-jupyter (with dev extras)
        run: |
          pip install -e ./pyvar-client
          pip install -e "./pyvar-jupyter[dev]"

      - name: black --check
        working-directory: pyvar-jupyter
        run: black --check --line-length 100 .

      - name: isort --check-only
        working-directory: pyvar-jupyter
        run: isort --check-only --profile black --line-length 100 .

      - name: ruff check
        working-directory: pyvar-jupyter
        run: ruff check .

      - name: Validate example notebooks are well-formed JSON
        working-directory: pyvar-jupyter
        run: |
          for f in examples/*.ipynb; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" || \
              (echo "::error::$f is not valid JSON" && exit 1)
          done

      - name: pytest
        working-directory: pyvar-jupyter
        run: pytest -v --cov=pyvar_jupyter --cov-report=term-missing --cov-fail-under=90
