name: pyvar plugins CI

# Scoped to .claude/skills/, plugins/, and .claude-plugin/ via paths: -- a
# real skills-authoring change (engine/, api/, etc.) has no reason to also
# run this, same reasoning as pyvar-client-ci.yml's own path scoping.
#
# Two independent things live under plugins/, both declared in the one
# .claude-plugin/marketplace.json:
# - 13 single-skill plugins (single-skill shorthand: SKILL.md at the plugin
#   root), each a generated copy of the matching .claude/skills/*/SKILL.md.
#   Source of truth stays .claude/skills/; scripts/generate_plugins.py
#   regenerates plugins/*.
# - plugins/mcp/, a real installable Python package (pyvar_mcp) -- an MCP
#   server whose tool catalogue (pyvar_mcp/_generated/functions.py) is
#   generated from portal/functions.json by scripts/generate_mcp_tools.py.
#
# plugins-drift-check is the same generate-then-diff pattern as
# pyvar-client-ci.yml's "Codegen drift check" job (regenerate, diff, fail
# with the exact command to fix it if stale) -- not a required status check
# on master (informational, same as that job). pyvar-mcp-tests is a normal
# lint+test job, same shape as pyvar-client-ci.yml's own "Lint & type check"
# and "Tests" jobs, just scoped to plugins/mcp/'s own pyproject.toml instead
# of the main repo's.

on:
  pull_request:
    branches: [master, develop]
    paths:
      - ".claude/skills/**"
      - "plugins/**"
      - ".claude-plugin/**"
      - "portal/functions.json"
      - "scripts/generate_plugins.py"
      - "scripts/generate_mcp_tools.py"
      - ".github/workflows/plugins-ci.yml"
  push:
    branches-ignore: [master]
    paths:
      - ".claude/skills/**"
      - "plugins/**"
      - ".claude-plugin/**"
      - "portal/functions.json"
      - "scripts/generate_plugins.py"
      - "scripts/generate_mcp_tools.py"
      - ".github/workflows/plugins-ci.yml"

jobs:
  plugins-drift-check:
    name: Skills plugins drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install black (generators self-format their output)
        run: pip install black==26.5.1

      - name: Regenerate skills plugins and diff
        # `git add -A` (not plain `git diff`) before diffing: a brand new
        # plugin directory (e.g. a skill added but plugins/ not regenerated)
        # is untracked, and plain `git diff` never shows untracked files --
        # only `git diff --cached` after staging catches that case too.
        run: |
          python3 scripts/generate_plugins.py
          git add -A -- plugins/
          git diff --cached --exit-code -- plugins/ || \
            (echo "::error::plugins/ is stale -- run 'python3 scripts/generate_plugins.py' \
            from the repo root and commit the diff." \
            && exit 1)

      - name: Regenerate MCP tool catalogue and diff
        run: |
          python3 scripts/generate_mcp_tools.py
          git add -A -- plugins/mcp/pyvar_mcp/_generated/
          git diff --cached --exit-code -- plugins/mcp/pyvar_mcp/_generated/ || \
            (echo "::error::plugins/mcp/pyvar_mcp/_generated/ is stale -- run \
            'python3 scripts/generate_mcp_tools.py' from the repo root and commit the diff." \
            && exit 1)

      - name: Validate plugin.json against marketplace.json
        # Every plugin.json's "name" must have a matching entry in
        # .claude-plugin/marketplace.json (generate_plugins.py already
        # enforces this at generation time -- this step catches the case
        # where someone hand-edits plugins/*/.claude-plugin/plugin.json
        # directly instead of regenerating it, and covers plugins/mcp/'s
        # hand-maintained plugin.json too, which generate_plugins.py never
        # touches).
        run: |
          python3 -c "
          import json, sys
          from pathlib import Path

          marketplace = json.loads(Path('.claude-plugin/marketplace.json').read_text())
          declared_names = {p['name'] for p in marketplace['plugins']}

          ok = True
          for plugin_json_path in sorted(Path('plugins').glob('*/.claude-plugin/plugin.json')) + \
                                   sorted(Path('plugins/arch').glob('*/.claude-plugin/plugin.json')):
              data = json.loads(plugin_json_path.read_text())
              if data['name'] not in declared_names:
                  print(f'::error::{plugin_json_path}: name {data[\"name\"]!r} not in marketplace.json')
                  ok = False
          sys.exit(0 if ok else 1)
          "

  pyvar-mcp-tests:
    name: pyvar-mcp lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pyvar-mcp with dev extras
        working-directory: plugins/mcp
        run: pip install -e ".[dev]"

      - name: Black (formatting)
        working-directory: plugins/mcp
        run: black --check --line-length 100 .

      - name: isort (import order)
        working-directory: plugins/mcp
        run: isort --check-only .

      - name: Ruff (fast linter)
        working-directory: plugins/mcp
        run: ruff check .

      - name: pytest
        working-directory: plugins/mcp
        run: pytest -v --cov=pyvar_mcp --cov-report=term-missing --cov-fail-under=90
