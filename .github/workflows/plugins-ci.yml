name: pyvar plugins CI

# Scoped to .claude/skills/, plugins/, and .claude-plugin/ via paths: -- a
# real skills-authoring change (engine/, api/, etc.) has no reason to also
# run this, same reasoning as pyvar-client-ci.yml's own path scoping.
#
# Each of the 13 plugins/* directories (see .claude-plugin/marketplace.json)
# is a single-skill Claude Code plugin (single-skill shorthand: SKILL.md at
# the plugin root, no nested skills/ subdirectory) whose SKILL.md is a
# generated copy of the matching .claude/skills/*/SKILL.md -- source of
# truth stays .claude/skills/, plugins/*/SKILL.md is regenerated by
# scripts/generate_plugins.py. This job is the drift check: same pattern as
# pyvar-client-ci.yml's "Codegen drift check" job (regenerate, diff,
# fail with the exact command to fix it if stale) -- not a required status
# check on master (informational, same as that job), consistent with how
# codegen drift is already handled elsewhere in this repo.

on:
  pull_request:
    branches: [master, develop]
    paths:
      - ".claude/skills/**"
      - "plugins/**"
      - ".claude-plugin/**"
      - "scripts/generate_plugins.py"
      - ".github/workflows/plugins-ci.yml"
  push:
    branches-ignore: [master]
    paths:
      - ".claude/skills/**"
      - "plugins/**"
      - ".claude-plugin/**"
      - "scripts/generate_plugins.py"
      - ".github/workflows/plugins-ci.yml"

jobs:
  plugins-drift-check:
    name: Skills plugins drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate and diff
        # `git add -A` (not plain `git diff`) before diffing: a brand new
        # plugin directory (e.g. a skill added but plugins/ not regenerated)
        # is untracked, and plain `git diff` never shows untracked files --
        # only `git diff --cached` after staging catches that case too.
        run: |
          python3 scripts/generate_plugins.py
          git add -A -- plugins/
          git diff --cached --exit-code -- plugins/ || \
            (echo "::error::plugins/ is stale -- run 'python3 scripts/generate_plugins.py' \
            from the repo root and commit the diff." \
            && exit 1)

      - name: Validate plugin.json against marketplace.json
        # Every plugin.json's "name" must have a matching entry in
        # .claude-plugin/marketplace.json (generate_plugins.py already
        # enforces this at generation time -- this step catches the case
        # where someone hand-edits plugins/*/.claude-plugin/plugin.json
        # directly instead of regenerating it).
        run: |
          python3 -c "
          import json, sys
          from pathlib import Path

          marketplace = json.loads(Path('.claude-plugin/marketplace.json').read_text())
          declared_names = {p['name'] for p in marketplace['plugins']}

          ok = True
          for plugin_json_path in sorted(Path('plugins').glob('*/.claude-plugin/plugin.json')) + \
                                   sorted(Path('plugins/arch').glob('*/.claude-plugin/plugin.json')):
              data = json.loads(plugin_json_path.read_text())
              if data['name'] not in declared_names:
                  print(f'::error::{plugin_json_path}: name {data[\"name\"]!r} not in marketplace.json')
                  ok = False
          sys.exit(0 if ok else 1)
          "
