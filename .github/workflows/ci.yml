name: pyvar CI

# Runs on every PR and push to non-master branches.
# The CodePipeline (triggered on master) is the CD path.
# This workflow provides fast feedback on PRs.

on:
  pull_request:
    branches: [master, develop]
  push:
    branches-ignore: [master]

env:
  PYTHON_VERSION: "3.11"

jobs:

  # ── 1. Lint & type check ───────────────────────────────────────────────────
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        # Pinned: an unpinned `pip install` floats to whatever's newest on
        # PyPI, so a new release (e.g. ruff 0.16.0 enabling new default
        # rules) can retroactively fail CI on already-merged code with no
        # PR having changed anything — as happened on 2026-07-29. Versions
        # below are the last confirmed-clean set against this repo. Bump
        # deliberately (and fix/triage whatever it newly flags) rather than
        # letting CI drift silently.
        run: pip install black==26.5.1 isort==8.0.1 mypy==2.3.0 ruff==0.15.22

      - name: Black (formatting)
        run: black --check --line-length 100 .

      - name: isort (import order)
        run: isort --check-only .

      - name: Ruff (fast linter)
        run: ruff check .

  # ── 2. Security scan ──────────────────────────────────────────────────────
  security:
    name: Security scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install bandit[toml]

      - name: Bandit security scan
        # -ll = report MEDIUM and HIGH severity only
        # Fail on HIGH findings; warn on MEDIUM
        run: bandit -r . -ll -x tests/ --exit-zero
        # Remove --exit-zero once all MEDIUM findings are resolved

  # ── 3. Unit & integration tests ───────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pyvar_test
          POSTGRES_USER: pyvar
          POSTGRES_PASSWORD: pyvar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-ci.txt
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run tests with coverage
        env:
          APP_ENV: test
          REDIS_URL: redis://localhost:6379/0
          POSTGRES_DSN: postgresql+asyncpg://pyvar:pyvar_test@localhost:5432/pyvar_test
          JWT_SECRET: test-jwt-secret-not-for-production
          CELERY_BROKER_URL: redis://localhost:6379/0
        run: |
          pytest -v \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: coverage.xml
          flags: python-${{ matrix.python-version }}

  # ── 4. CDK synth check ────────────────────────────────────────────────────
  cdk-synth:
    name: CDK synth check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install CDK
        run: |
          npm install -g aws-cdk
          pip install -r pyvar-cdk/requirements.txt

      - name: CDK synth (dev, no deploy)
        env:
          AWS_DEFAULT_REGION: eu-west-1
          # Dummy account for synth — no actual AWS calls
          CDK_DEFAULT_ACCOUNT: "123456789012"
          CDK_DEFAULT_REGION: eu-west-1
        run: |
          cd pyvar-cdk
          cdk synth \
            --context env=dev \
            --context account=123456789012 \
            --no-asset-metadata 2>&1 | tail -20

  # ── 5. Docker build check ─────────────────────────────────────────────────
  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build API image (no push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: pyvar-api:pr-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
