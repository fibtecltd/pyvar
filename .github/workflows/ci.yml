name: pyvar CI

# Runs on every PR and push to non-main branches.
# The CodePipeline (triggered on main) is the CD path.
# This workflow provides fast feedback on PRs.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches-ignore: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:

  # ── 1. Lint & type check ───────────────────────────────────────────────────
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: pip install black isort mypy ruff

      - name: Black (formatting)
        run: black --check --line-length 100 .

      - name: isort (import order)
        run: isort --check-only .

      - name: Ruff (fast linter)
        run: ruff check .

  # ── 2. Security scan ──────────────────────────────────────────────────────
  security:
    name: Security scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install bandit[toml]

      - name: Bandit security scan
        # -ll = report MEDIUM and HIGH severity only
        # Fail on HIGH findings; warn on MEDIUM
        run: bandit -r . -ll -x tests/ --exit-zero
        # Remove --exit-zero once all MEDIUM findings are resolved

  # ── 3. Unit & integration tests ───────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pyvar_test
          POSTGRES_USER: pyvar
          POSTGRES_PASSWORD: pyvar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run tests with coverage
        env:
          APP_ENV: test
          REDIS_URL: redis://localhost:6379/0
          POSTGRES_DSN: postgresql+asyncpg://pyvar:pyvar_test@localhost:5432/pyvar_test
          JWT_SECRET: test-jwt-secret-not-for-production
          CELERY_BROKER_URL: redis://localhost:6379/0
        run: |
          pytest -v \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: python-${{ matrix.python-version }}

  # ── 4. CDK synth check ────────────────────────────────────────────────────
  cdk-synth:
    name: CDK synth check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CDK
        run: |
          npm install -g aws-cdk
          pip install -r pyvar-cdk/requirements.txt

      - name: CDK synth (dev, no deploy)
        env:
          AWS_DEFAULT_REGION: eu-west-2
          # Dummy account for synth — no actual AWS calls
          CDK_DEFAULT_ACCOUNT: "123456789012"
          CDK_DEFAULT_REGION: eu-west-2
        run: |
          cd pyvar-cdk
          cdk synth \
            --context env=dev \
            --context account=123456789012 \
            --no-asset-metadata 2>&1 | tail -20

  # ── 5. Docker build check ─────────────────────────────────────────────────
  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: pyvar-api:pr-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
