[tool.isort]
profile = "black"
line_length = 100
# pyvar_client (pyvar-client/pyvar_client/) is nested two levels under repo
# root, not a direct top-level package -- isort's default first-party
# auto-detection (scans src_paths, default ".") only finds it when cwd is
# pyvar-client/ itself (pyvar-client's own pyproject.toml needs no override
# for exactly that reason). Root-level `isort --check-only .` (the main CI
# lint job) doesn't find it that way and misclassifies pyvar_client imports
# as third-party -- explicit here so both invocations agree.
known_first_party = ["pyvar_client"]

[tool.black]
line-length = 100

[tool.bandit]
exclude_dirs = ["tests", "scripts/hooks", "scripts/claude"]
skips = ["B101", "B311", "B403"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# type-arg: bare dict/list/tuple annotations — too widespread across engine/
# to fix inline; suppressed globally. All other strict checks remain active.
disable_error_code = ["type-arg"]

[tool.coverage.run]
omit = [
    # Auto-generated thin route wrappers — logic is tested via engine tests
    "api/routes/alm.py",
    "api/routes/credit_risk.py",
    "api/routes/derivatives.py",
    "api/routes/liquidity.py",
    "api/routes/market_risk.py",
    "api/routes/operational.py",
    "api/routes/portfolio.py",
    "api/routes/regulatory.py",
    # Infrastructure files requiring live services (S3, DB, Celery, Streamlit)
    "ui/*",
    "worker.py",
    "storage/s3.py",
    "storage/models.py",
    "ingestion/loader.py",
]
