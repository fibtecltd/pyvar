[tool.isort]
profile = "black"
line_length = 100
# pyvar_client (pyvar-client/pyvar_client/) and pyvar_mcp (plugins/mcp/
# pyvar_mcp/) are both nested two levels under repo root, not direct
# top-level packages -- isort's default first-party auto-detection (scans
# src_paths, default ".") only finds them when cwd is their own package
# root (neither pyvar-client/ nor plugins/mcp/'s own pyproject.toml needs
# this override for exactly that reason). Root-level `isort --check-only .`
# (the main CI lint job) doesn't find them that way and misclassifies their
# imports as third-party -- explicit here so both invocations agree.
known_first_party = ["pyvar_client", "pyvar_mcp"]

[tool.black]
line-length = 100

[tool.bandit]
exclude_dirs = ["tests", "scripts/hooks", "scripts/claude"]
skips = ["B101", "B311", "B403"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# type-arg: bare dict/list/tuple annotations — too widespread across engine/
# to fix inline; suppressed globally. All other strict checks remain active.
disable_error_code = ["type-arg"]

[tool.coverage.run]
omit = [
    # Auto-generated thin route wrappers — logic is tested via engine tests
    "api/routes/alm.py",
    "api/routes/credit_risk.py",
    "api/routes/derivatives.py",
    "api/routes/liquidity.py",
    "api/routes/market_risk.py",
    "api/routes/operational.py",
    "api/routes/portfolio.py",
    "api/routes/regulatory.py",
    # Infrastructure files requiring live services (S3, DB, Celery, Streamlit)
    "ui/*",
    "worker.py",
    "storage/s3.py",
    "storage/models.py",
    "ingestion/loader.py",
]
